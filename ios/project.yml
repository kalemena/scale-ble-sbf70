name: Sbf70App
options:
  bundleIdPrefix: org.kalemena
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Sbf70Kit:
    path: Sbf70Kit

targets:
  Sbf70App:
    type: application
    platform: iOS
    sources:
      - Sbf70App
    dependencies:
      - package: Sbf70Kit
    info:
      path: Sbf70App/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: >-
          The app connects to your SBF70 / BF710 body scale over Bluetooth
          to sync saved measurements and run live weigh-ins.
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kalemena.sbf70app
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"

schemes:
  Sbf70App:
    build:
      targets:
        Sbf70App: all
    run:
      config: Debug
    archive:
      config: Release
